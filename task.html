<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tejmay | Tasks</title>
  <meta name="description" content="A calm task page for daily priorities and focus." />
  <style>
    :root {
      --bg: #f5f3ee;
      --panel: #ffffff;
      --panel-alt: #f0efe9;
      --text: #171717;
      --muted: #66615c;
      --line: rgba(23, 23, 23, 0.08);
      --shadow: rgba(17, 17, 17, 0.07);
      --accent: #111111;
      --accent-soft: #e9e2d7;
      --success: #2d6a4f;
      --danger: #9a3d3d;
      --radius: 18px;
      --warm: #d08d63;
      --sage: #7f9c86;
      --lavender: #8f84c8;
    }

    body[data-theme="dark"] {
      --bg: #070b14;
      --panel: rgba(16,24,36,0.92);
      --panel-alt: rgba(10,16,24,0.86);
      --text: #edf3ff;
      --muted: #a6b5c9;
      --line: rgba(148,163,184,0.12);
      --shadow: rgba(0,0,0,0.6);
      --accent: #7dd3fc;
      --accent-soft: rgba(125,211,252,0.08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #f8f6f2 0%, #f1efe9 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      transition: background 300ms ease, color 300ms ease;
      background-color: var(--bg);
    }

    body[data-theme="dark"] {
      background: radial-gradient(circle at 10% 10%, rgba(125,211,252,0.04), transparent 12%),
                  linear-gradient(180deg, #050712 0%, #07101a 100%);
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }

    .container {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
    }

    .site-header {
      padding: 18px 0 12px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    .brand-mark {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 0 0 5px rgba(17, 17, 17, 0.06);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .nav-links a {
      transition: color 0.2s ease;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel-alt);
      cursor: pointer;
      font-size: 1rem;
      color: var(--muted);
      transition: background 0.2s ease, color 0.2s ease, transform 0.12s ease;
    }

    .theme-toggle:hover { transform: translateY(-2px); color: var(--text); }

    .app-shell {
      padding: 12px 0 60px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 28px;
    }

    .greeting {
      font-size: clamp(2.2rem, 4vw, 4rem);
      line-height: 1;
      letter-spacing: -0.06em;
      margin: 0;
      font-weight: 700;
    }

    .date-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      color: var(--muted);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    body[data-theme="dark"] .date-chip {
      background: rgba(255,255,255,0.04);
      color: var(--muted);
    }

    .panel-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 22px;
    }

    .panel {
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 26px var(--shadow);
      backdrop-filter: blur(12px);
    }

    body[data-theme="dark"] .panel {
      background: var(--panel);
      border-color: rgba(255,255,255,0.03);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .task-panel {
      padding: 24px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .task-form {
      display: grid;
      gap: 14px;
      margin-bottom: 22px;
      padding: 14px;
      border: 1px solid var(--line);
      background: var(--panel-alt);
      border-radius: 16px;
    }

    body[data-theme="dark"] .task-form {
      background: rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.04);
    }

    .task-form input,
    .task-form select {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      color: var(--text);
      padding: 12px 14px;
      outline: none;
    }

    body[data-theme="dark"] .task-form input,
    body[data-theme="dark"] .task-form select {
      background: rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.04);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .priority-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 180px;
    }

    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 700;
    }

    .primary-btn {
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      border-radius: 12px;
      padding: 10px 16px;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .task-list {
      display: grid;
      gap: 14px;
    }

    .task-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 16px;
      background: var(--panel-alt);
      border: 1px solid var(--line);
      border-radius: 16px;
      transition: transform 0.2s ease, border-color 0.2s ease;
      animation: fadeIn 0.25s ease;
    }

    body[data-theme="dark"] .task-card {
      background: rgba(255,255,255,0.02);
      border-color: rgba(255,255,255,0.04);
    }

    .task-card:hover {
      transform: translateX(2px);
      border-color: rgba(17,17,17,0.14);
    }

    .task-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .task-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--line);
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .task-card.done .task-check {
      background: var(--success);
      border-color: var(--success);
      position: relative;
    }

    .task-card.done .task-check::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: white;
    }

    .task-text {
      font-size: 0.97rem;
      color: var(--text);
      word-break: break-word;
    }

    .task-card.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .priority-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }

    .priority-pill.high {
      background: rgba(154, 61, 61, 0.08);
      color: var(--danger);
      border-color: rgba(154, 61, 61, 0.16);
    }

    .priority-pill.medium {
      background: rgba(208, 141, 99, 0.1);
      color: #9a5a2c;
      border-color: rgba(208, 141, 99, 0.2);
    }

    .priority-pill.low {
      background: rgba(45, 106, 79, 0.1);
      color: var(--success);
      border-color: rgba(45, 106, 79, 0.16);
    }

    .empty-state {
      padding: 26px 16px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .side-panel {
      padding: 22px;
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .mini-card {
      background: var(--panel-alt);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }

    body[data-theme="dark"] .mini-card {
      background: rgba(255,255,255,0.02);
      border-color: rgba(255,255,255,0.04);
    }

    .mini-card h3 {
      margin: 0 0 8px;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .stat-value {
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      letter-spacing: -0.06em;
      margin: 6px 0 0;
      font-weight: 700;
    }

    .task-summary {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-summary li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text);
      font-size: 0.95rem;
    }

    .quote-box {
      padding: 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(17,17,17,0.04), rgba(17,17,17,0.01));
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.96rem;
      font-style: italic;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 820px) {
      .panel-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav-links {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>Tejmay</span>
      </div>

      <div style="display:flex;align-items:center;gap:10px;">
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="task.html" class="active">Tasks</a>
          <a href="journal.html">Journal</a>
        </nav>

        <button id="themeToggle" class="theme-toggle" aria-pressed="false" aria-label="Toggle dark mode">🌙</button>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <div class="container">
      <div class="topbar">
        <h1 class="greeting">Priorities.</h1>
        <div class="date-chip" id="todayDate"></div>
      </div>

      <div class="panel-grid">
        <section class="panel task-panel" aria-label="Task list">
          <div class="panel-header">
            <div class="panel-title">Task list</div>
          </div>

          <form class="task-form" id="taskForm">
            <input id="taskInput" type="text" placeholder="Add a small win for today..." aria-label="Add a task" />
            <div class="input-row">
              <div class="priority-wrap">
                <span class="label">Priority</span>
                <select id="priorityInput" aria-label="Set task priority">
                  <option value="high">High</option>
                  <option value="medium" selected>Medium</option>
                  <option value="low">Low</option>
                </select>
              </div>
              <button type="submit" class="primary-btn">Add task</button>
            </div>
          </form>

          <div class="task-list" id="taskList" aria-live="polite"></div>
          <div class="empty-state" id="emptyState" hidden>No tasks yet. Add one that moves your day forward.</div>
        </section>

        <aside class="panel side-panel" aria-label="Task overview">
          <div class="mini-card">
            <h3>Tasks</h3>
            <div class="stat-value" id="taskCount">0</div>
          </div>

          <div class="mini-card">
            <h3>Focus</h3>
            <ul class="task-summary">
              <li><span>Done</span><strong id="doneCount">0</strong></li>
              <li><span>Open</span><strong id="openCount">0</strong></li>
            </ul>
          </div>

          <div class="quote-box" id="taskQuote">
            “One clear action is worth ten scattered intentions.”
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'task-list-v1';
    const THEME_KEY = 'theme-preference-v1';
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const priorityInput = document.getElementById('priorityInput');
    const taskList = document.getElementById('taskList');
    const emptyState = document.getElementById('emptyState');
    const taskCount = document.getElementById('taskCount');
    const doneCount = document.getElementById('doneCount');
    const openCount = document.getElementById('openCount');
    const todayDate = document.getElementById('todayDate');
    const themeToggle = document.getElementById('themeToggle');

    const defaultTasks = [
      {
        id: crypto.randomUUID(),
        text: 'Plan the next three priorities for the day',
        priority: 'high',
        done: false,
        createdAt: new Date().toISOString()
      },
      {
        id: crypto.randomUUID(),
        text: 'Clear the inbox before noon',
        priority: 'medium',
        done: true,
        createdAt: new Date(Date.now() - 86400000).toISOString()
      }
    ];

    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultTasks;

    function formatDate() {
      const now = new Date();
      return new Intl.DateTimeFormat('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      }).format(now);
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function renderTasks() {
      taskList.innerHTML = '';

      if (!tasks.length) {
        emptyState.hidden = false;
      } else {
        emptyState.hidden = true;
      }

      const sortedTasks = [...tasks].sort((a, b) => {
        if (a.done !== b.done) return Number(a.done) - Number(b.done);
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      sortedTasks.forEach(task => {
        const item = document.createElement('article');
        item.className = `task-card ${task.done ? 'done' : ''}`;
        item.innerHTML = `
          <div class="task-main">
            <button class="task-check" type="button" aria-label="Mark task complete" data-task-id="${task.id}"></button>
            <div class="task-text">${escapeHtml(task.text)}</div>
          </div>
          <span class="priority-pill ${task.priority}">${task.priority}</span>
        `;
        taskList.appendChild(item);
      });

      const done = tasks.filter(task => task.done).length;
      const open = tasks.length - done;
      taskCount.textContent = tasks.length;
      doneCount.textContent = done;
      openCount.textContent = open;
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    taskForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = taskInput.value.trim();
      if (!value) return;

      tasks.unshift({
        id: crypto.randomUUID(),
        text: value,
        priority: priorityInput.value,
        done: false,
        createdAt: new Date().toISOString()
      });

      taskInput.value = '';
      priorityInput.value = 'medium';
      saveTasks();
      renderTasks();
    });

    taskList.addEventListener('click', (event) => {
      const button = event.target.closest('.task-check');
      if (!button) return;
      const taskId = button.dataset.taskId;
      tasks = tasks.map(task => task.id === taskId ? { ...task, done: !task.done } : task);
      saveTasks();
      renderTasks();
    });

    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      const isDark = theme === 'dark';
      themeToggle.setAttribute('aria-pressed', String(isDark));
      themeToggle.textContent = isDark ? '☀️' : '🌙';
    }

    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved) {
        applyTheme(saved);
        return;
      }

      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark ? 'dark' : 'light');
    }

    themeToggle.addEventListener('click', () => {
      const current = document.body.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem(THEME_KEY, next);
    });

    todayDate.textContent = formatDate();
    renderTasks();
    initTheme();
  </script>
</body>
</html>
