<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tejmay | Minimal To-Do</title>
  <meta name="description" content="Minimal personal task dashboard for daily focus." />
  <style>
    :root {
      --bg: #f5f3ee;
      --panel: #ffffff;
      --panel-alt: #f0efe9;
      --text: #171717;
      --muted: #66615c;
      --line: rgba(23, 23, 23, 0.08);
      --shadow: rgba(17, 17, 17, 0.07);
      --accent: #111111;
      --accent-soft: #e9e2d7;
      --success: #2d6a4f;
      --danger: #9a3d3d;
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #f8f6f2 0%, #f1efe9 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .container {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
    }

    .site-header {
      padding: 26px 0 14px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    .brand-mark {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 0 0 5px rgba(17, 17, 17, 0.06);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .nav-links a {
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .app-shell {
      padding: 12px 0 60px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 28px;
    }

    .greeting {
      font-size: clamp(2.2rem, 4vw, 4rem);
      line-height: 1;
      letter-spacing: -0.06em;
      margin: 0;
      font-weight: 700;
    }

    .date-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      color: var(--muted);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 22px;
    }

    .panel {
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 26px var(--shadow);
      backdrop-filter: blur(12px);
    }

    .todo-panel {
      padding: 24px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .todo-panel:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(17,17,17,0.08);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .task-count {
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--panel-alt);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 10px;
    }

    .todo-form {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding: 8px 10px 8px 12px;
      border: 1px solid var(--line);
      background: var(--panel-alt);
      border-radius: 14px;
    }

    .todo-form input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      padding: 10px 0;
    }

    .todo-form input::placeholder {
      color: #867f79;
    }

    .add-btn {
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .add-btn:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.82rem;
    }

    .filter-btn.active {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }

    .todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel-alt);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 12px;
      transition: transform 0.2s ease, border-color 0.2s ease, opacity 0.25s ease;
      animation: fadeIn 0.25s ease;
    }

    .todo-item:hover {
      transform: translateX(2px);
      border-color: rgba(17,17,17,0.14);
    }

    .todo-item.done {
      opacity: 0.72;
    }

    .todo-item.done .task-label {
      text-decoration: line-through;
      color: var(--muted);
    }

    .checkbox {
      position: relative;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(17,17,17,0.4);
      appearance: none;
      outline: none;
      cursor: pointer;
      flex-shrink: 0;
      background: transparent;
      transition: all 0.2s ease;
    }

    .checkbox:checked {
      background: var(--text);
      border-color: var(--text);
    }

    .checkbox:checked::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 5px;
      border-left: 2px solid white;
      border-bottom: 2px solid white;
      transform: rotate(-45deg);
      left: 4px;
      top: 4px;
    }

    .task-label {
      flex: 1;
      min-width: 0;
      word-break: break-word;
      font-size: 0.98rem;
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      font-size: 1.1rem;
    }

    .delete-btn:hover {
      background: rgba(154,61,61,0.08);
      color: var(--danger);
    }

    .empty-state {
      padding: 26px 16px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .side-panel {
      padding: 22px;
      display: grid;
      gap: 18px;
    }

    .mini-card {
      background: var(--panel-alt);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }

    .mini-card h3 {
      margin: 0 0 8px;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .stat-value {
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      letter-spacing: -0.06em;
      margin: 6px 0 0;
      font-weight: 700;
    }

    .focus-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .focus-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: 0.95rem;
    }

    .focus-list li::before {
      content: "•";
      color: var(--muted);
      font-size: 1.3rem;
      line-height: 1;
    }

    .progress {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(17,17,17,0.08);
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-bar {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--text), #777);
      border-radius: inherit;
      transition: width 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 820px) {
      .panel-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav-links {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>Tejmay</span>
      </div>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="#">Home</a>
        <a href="#">Tasks</a>
        <a href="journal.html">Journal</a>
      </nav>
    </div>
  </header>

  <main class="app-shell">
    <div class="container">
      <div class="topbar">
        <h1 class="greeting">Good day.</h1>
        <div class="date-chip" id="todayDate"></div>
      </div>

      <div class="panel-grid">
        <section class="panel todo-panel" aria-label="To-do list">
          <div class="panel-header">
            <div class="panel-title">My tasks</div>
            <div class="task-count"><span id="remainingCount">0</span> left</div>
          </div>

          <form class="todo-form" id="todoForm">
            <input id="todoInput" type="text" placeholder="Add a task..." aria-label="Add a task" maxlength="120" />
            <button type="submit" class="add-btn">Add</button>
          </form>

          <div class="filters" aria-label="Task filters">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="active" type="button">Active</button>
            <button class="filter-btn" data-filter="completed" type="button">Done</button>
          </div>

          <ul class="todo-list" id="todoList" aria-live="polite"></ul>
          <div class="empty-state" id="emptyState" hidden>No tasks yet. Add your first focus item.</div>
        </section>

        <aside class="panel side-panel" aria-label="Task overview">
          <div class="mini-card">
            <h3>Focus</h3>
            <div class="stat-value" id="focusCount">0</div>
            <div class="progress">
              <span class="progress-bar" id="progressBar"></span>
            </div>
          </div>

          <div class="mini-card">
            <h3>Today</h3>
            <ul class="focus-list">
              <li>Review priorities</li>
              <li>Finish key task</li>
              <li>Keep it simple</li>
            </ul>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'minimal-todo-v1';
    const todoForm = document.getElementById('todoForm');
    const todoInput = document.getElementById('todoInput');
    const todoList = document.getElementById('todoList');
    const remainingCount = document.getElementById('remainingCount');
    const focusCount = document.getElementById('focusCount');
    const progressBar = document.getElementById('progressBar');
    const emptyState = document.getElementById('emptyState');
    const todayDate = document.getElementById('todayDate');
    const filterButtons = document.querySelectorAll('.filter-btn');

    let currentFilter = 'all';
    let todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
      { id: crypto.randomUUID(), text: 'Plan today', done: false },
      { id: crypto.randomUUID(), text: 'Finish one important task', done: true },
      { id: crypto.randomUUID(), text: 'Take a short break', done: false }
    ];

    function formatDate() {
      const now = new Date();
      return new Intl.DateTimeFormat('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      }).format(now);
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function getFilteredTodos() {
      if (currentFilter === 'active') return todos.filter(todo => !todo.done);
      if (currentFilter === 'completed') return todos.filter(todo => todo.done);
      return todos;
    }

    function updateStats() {
      const active = todos.filter(todo => !todo.done).length;
      const completed = todos.filter(todo => todo.done).length;
      const total = todos.length || 1;

      remainingCount.textContent = active;
      focusCount.textContent = `${completed}/${total}`;
      const percent = total ? Math.round((completed / total) * 100) : 0;
      progressBar.style.width = `${percent}%`;
    }

    function renderTodos() {
      const filtered = getFilteredTodos();
      todoList.innerHTML = '';

      if (!filtered.length) {
        emptyState.hidden = false;
      } else {
        emptyState.hidden = true;
      }

      filtered.forEach(todo => {
        const item = document.createElement('li');
        item.className = `todo-item ${todo.done ? 'done' : ''}`;
        item.innerHTML = `
          <input class="checkbox" type="checkbox" ${todo.done ? 'checked' : ''} aria-label="Mark task as complete" />
          <span class="task-label">${escapeHtml(todo.text)}</span>
          <button class="delete-btn" type="button" aria-label="Delete task">×</button>
        `;

        const checkbox = item.querySelector('.checkbox');
        checkbox.addEventListener('change', () => {
          todo.done = checkbox.checked;
          saveTodos();
          renderTodos();
          updateStats();
        });

        item.querySelector('.delete-btn').addEventListener('click', () => {
          todos = todos.filter(t => t.id !== todo.id);
          saveTodos();
          renderTodos();
          updateStats();
        });

        todoList.appendChild(item);
      });

      updateStats();
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    todoForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = todoInput.value.trim();
      if (!value) return;

      todos.unshift({
        id: crypto.randomUUID(),
        text: value,
        done: false
      });

      todoInput.value = '';
      saveTodos();
      renderTodos();
    });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter;
        filterButtons.forEach(btn => btn.classList.toggle('active', btn === button));
        renderTodos();
      });
    });

    todayDate.textContent = formatDate();
    renderTodos();
  </script>
</body>
</html>
